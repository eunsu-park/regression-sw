# Server Configuration for the ap30 target (GPU server, ~/Projects/GeoIndex (cloud-synced; also mounted on the Mac)).
#
# Inherits local.yaml (table mode, batch/epoch/training settings) and replaces
# the environment paths and the index directory. The ap30 input/target come
# straight from base.yaml (input = 21 solar-wind columns + ap30, target = ap30),
# so nothing extra is needed here for the model wiring.
#
# Expected data layout on the server:
#   /home/eunsupark/Projects/GeoIndex/datasets/
#     data.parquet
#     total_ap/{train_index.csv, validation_index.csv}   # ap30 labels
#     total_hp/{train_index.csv, validation_index.csv}   # hp30 labels
#
# Prereq:  conda activate geoindex

defaults:
  - local
  - _self_

# =============================================================================
# Environment (GPU server, ~/Projects/GeoIndex (cloud-synced; also mounted on the Mac))
# =============================================================================
environment:
  device: "cuda"
  data_root: "/home/eunsupark/Projects/GeoIndex/datasets"
  save_root: "/home/eunsupark/Projects/GeoIndex/results"
  # Single RTX 3090: run_pending/analysis launchers use --max-jobs 4, so keep
  # 4 loader workers per process (4 jobs x 4 = 16 workers) to avoid CPU
  # oversubscription. Table data is in-memory, so few workers suffice.
  num_workers: 4

# CV fold index directory (ap labels), used by configs/cv/fold*.yaml.
cv_dir: "cv5_ap"

# =============================================================================
# Monte Carlo Dropout (batch runs on a single GPU)
#   num_mc_samples kept at the full 100 forward passes per sample for the best
#   uncertainty estimate. Plots are skipped in batch mode — regenerate only for
#   the selected model.
# =============================================================================
mcd:
  num_mc_samples: 100
  create_plots: false

# Batch sweeps: never render per-anchor attention plots (a single run's
# attention plots.zip reached 7 GB on the 2026-08 Mac backfill).
attention:
  create_plots: false

# =============================================================================
# Data (table mode, ap30 index)
# Window offsets (input_start/end, target_start/end) come from the +io= group.
# =============================================================================
data:
  timeseries:
    train_index: "total_ap/train_index.csv"
    validation_index: "total_ap/validation_index.csv"
    # No dedicated test split yet; fall back to the validation index.
    test_index: "total_ap/validation_index.csv"
    # Per-target stats cache: ap and hp runs must not share one file —
    # whichever runs last overwrites it with its own variable set
    # (the hp sweep dropped ap30 from the shared cache on 2026-07).
    stat_file: "table_stats_ap.pkl"

# Batch sweeps: skip per-sample validation plots (plots.zip is ~0.5–1.5 GB per
# run and pollutes the cloud-synced results tree; regenerate on demand for a
# selected model only).
validation:
  save_plots: false
